<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBot Chat Agent - Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 900px;
            height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.8;
            font-size: 14px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message.bot {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
            color: white;
        }

        .message.bot .message-content {
            background: #e9ecef;
            color: #333;
            border: 1px solid #dee2e6;
            white-space: break-spaces;
        }

        .chips-container {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 115, 255, 0.3);
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            background: white;
        }

        .input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #6B73FF;
        }

        .send-button {
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .connection-status {
            padding: 10px 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .debug-info {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
            font-family: monospace;
        }

        .typing-indicator {
            display: none;
            text-align: left;
            margin-bottom: 15px;
        }

        .typing-indicator .message-content {
            background: #e9ecef;
            color: #666;
            padding: 12px 16px;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 1px;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .system-message {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 20px 0;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 BookBot Chat Agent</h1>
            <p>Smart assistant: chat + book search</p>
        </div>

        <div class="connection-status" id="connectionStatus">Connecting...</div>

        <div class="messages-container" id="messagesContainer">
            <div class="system-message">
                Hello! I'm ChatAgent - BookBot's smart assistant. I can both chat and find interesting books for you! 📚
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="message-content">
                ChatAgent is typing
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Write something or ask to find books..."
                    maxlength="500"
                >
                <button id="sendButton" class="send-button">Send</button>
            </div>
        </div>
    </div>

    <script>
        class ChatAgent {
            constructor() {
                this.ws = null;
                this.sessionId = this.generateSessionId();
                this.isConnected = false;
                this.messageQueue = [];
                
                this.initElements();
                this.connect();
                this.bindEvents();
            }

            generateSessionId() {
                return 'chat-agent-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
            }

            initElements() {
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.messagesContainer = document.getElementById('messagesContainer');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.typingIndicator = document.getElementById('typingIndicator');
            }

            connect() {
                try {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws/chat_agent`;
                    
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log('🤖 ChatAgent WebSocket connected');
                        this.isConnected = true;
                        this.updateConnectionStatus('connected');
                        
                        // Send queued messages
                        while (this.messageQueue.length > 0) {
                            this.ws.send(this.messageQueue.shift());
                        }
                    };
                    
                    this.ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        console.log('📨 Response from ChatAgent:', data);
                        this.handleResponse(data);
                    };
                    
                    this.ws.onclose = (event) => {
                        console.log('🔌 ChatAgent WebSocket closed:', event.code, event.reason);
                        this.isConnected = false;
                        this.updateConnectionStatus('disconnected');
                        
                        // Reconnect in 3 seconds
                        setTimeout(() => {
                            console.log('🔄 Reconnecting...');
                            this.connect();
                        }, 3000);
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('❌ WebSocket error:', error);
                        this.updateConnectionStatus('disconnected');
                    };
                    
                } catch (error) {
                    console.error('❌ WebSocket creation error:', error);
                    this.updateConnectionStatus('disconnected');
                }
            }

            updateConnectionStatus(status) {
                this.connectionStatus.className = `connection-status ${status}`;
                
                if (status === 'connected') {
                    this.connectionStatus.textContent = '✅ Connected to ChatAgent';
                    this.sendButton.disabled = false;
                } else {
                    this.connectionStatus.textContent = '❌ No connection (reconnecting...)';
                    this.sendButton.disabled = true;
                }
            }

            bindEvents() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-focus on input
                this.messageInput.focus();
            }

            sendMessage(messageText = null) {
                const message = messageText || this.messageInput.value.trim();
                
                if (!message) return;
                
                // Show user message
                this.addMessage('user', message);
                
                // Clear input only if message was entered manually
                if (!messageText) {
                    this.messageInput.value = '';
                }
                
                // Show typing indicator
                this.showTypingIndicator();
                
                const payload = {
                    session_id: this.sessionId,
                    message: message
                };
                
                if (this.isConnected && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(payload));
                } else {
                    console.log('📝 Message added to queue');
                    this.messageQueue.push(JSON.stringify(payload));
                }
            }

            handleResponse(data) {
                this.hideTypingIndicator();
                
                // Add bot response
                this.addMessage('bot', data.reply, data.chips, data.debug);
                
                // Focus back on input
                this.messageInput.focus();
            }

            addMessage(sender, content, chips = null, debug = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;
                
                messageDiv.appendChild(contentDiv);
                
                // Add chips for bot messages
                if (sender === 'bot' && chips && chips.length > 0) {
                    const chipsContainer = document.createElement('div');
                    chipsContainer.className = 'chips-container';
                    
                    chips.forEach(chip => {
                        const chipButton = document.createElement('button');
                        chipButton.className = 'chip';
                        chipButton.textContent = chip.text;
                        chipButton.addEventListener('click', () => {
                            this.sendMessage(chip.text);
                        });
                        chipsContainer.appendChild(chipButton);
                    });
                    
                    messageDiv.appendChild(chipsContainer);
                }
                
                // Add debug info for bot messages
                if (sender === 'bot' && debug) {
                    const debugDiv = document.createElement('div');
                    debugDiv.className = 'debug-info';
                    debugDiv.innerHTML = `
                        <strong>Debug info:</strong><br>
                        Intent: ${debug.intent || 'unknown'}<br>
                        Mode: ${debug.mode || 'unknown'}<br>
                        Route: ${debug.route_taken || 'unknown'}<br>
                        Processing Time: ${debug.processing_time || 'N/A'}
                    `;
                    messageDiv.appendChild(debugDiv);
                }
                
                this.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
            }

            showTypingIndicator() {
                this.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }

            hideTypingIndicator() {
                this.typingIndicator.style.display = 'none';
            }

            scrollToBottom() {
                setTimeout(() => {
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                }, 100);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            new ChatAgent();
        });
    </script>
</body>
</html>
