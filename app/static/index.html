<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BookBot Chat</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#e8ecf1}
.chat{max-width:800px;margin:40px auto;background:#131a33;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.row{display:flex;gap:12px}.input{flex:1;background:#0f1530;border:1px solid #2b3566;border-radius:12px;padding:12px;color:#e8ecf1}
.btn{background:#3947a3;color:#fff;border:none;padding:12px 16px;border-radius:12px;cursor:pointer}.btn:hover{filter:brightness(1.1)}
.bubble{background:#0f1530;padding:12px 14px;border:1px solid #2b3566;border-radius:12px;margin:10px 0;white-space:pre-wrap}.me{background:#1a2247;text-align:right}
</style></head><body><div class="chat"><h2>📚 BookBot — Chat</h2><div id="log"></div><div class="row">
<input id="msg" class="input" placeholder="Ask by ISBN, author, genre, topic…"/><button class="btn" onclick="send()">Send</button></div></div>
<script>
const sid=(Math.random()+1).toString(36).slice(2),log=document.getElementById('log'),msg=document.getElementById('msg');
function addBubble(t,me=false){const d=document.createElement('div');d.className='bubble'+(me?' me':'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;}
async function send(){const q=msg.value.trim();if(!q)return;addBubble(q,true);msg.value='';const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:q})});const data=await res.json();const ans=(data.results&&data.results[0]&&(data.results[0].message||data.results[0].clarify))||JSON.stringify(data);addBubble(ans);}
</script></body></html>
